<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ChainTrace — Blockchain OSINT Visualizer</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020810;--surface:#070f1d;--surface2:#0b1628;--border:#0f2035;
  --accent:#00e5ff;--accent2:#7c3aed;--warn:#f59e0b;--danger:#ef4444;--success:#00ff88;
  --text:#d4e8ff;--muted:#3d6080;--font-head:'Syne',sans-serif;--font-mono:'Space Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);overflow-x:hidden;cursor:default}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#0f3050;border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeInFast{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes slideShine{0%{left:-80px}100%{left:120%}}
@keyframes scanLine{0%{top:-2px;opacity:.8}100%{top:100vh;opacity:0}}
@keyframes rippleOut{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.5);opacity:0}}
@keyframes nodeAppear{0%{opacity:0;transform:scale(0.4)}100%{opacity:1;transform:scale(1)}}
@keyframes borderFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 6px #00e5ff30,inset 0 0 6px #00e5ff08}50%{box-shadow:0 0 20px #00e5ff60,inset 0 0 12px #00e5ff15}}
@keyframes textGlow{0%,100%{text-shadow:0 0 10px #00e5ff50}50%{text-shadow:0 0 30px #00e5ff,0 0 60px #00e5ff60}}
@keyframes datastream{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
.fade-in{animation:fadeIn .45s ease both}
.fade-fast{animation:fadeInFast .2s ease both}
.pulse{animation:pulse 2s ease infinite}
/* Canvas background */
#chain-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
/* App layer */
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
/* Navbar */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 32px;border-bottom:1px solid rgba(0,229,255,.08);
  background:rgba(2,8,16,.88);backdrop-filter:blur(24px);
  position:sticky;top:0;z-index:100;
}
.logo{font-family:var(--font-head);font-weight:800;font-size:22px;color:#fff;letter-spacing:-1px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo-icon{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.logo-hex{width:24px;height:24px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);transition:all .3s;box-shadow:0 0 16px var(--accent)}
.logo:hover .logo-hex{transform:rotate(30deg) scale(1.2);box-shadow:0 0 30px var(--accent)}
.logo-ring{position:absolute;inset:-3px;border:1px solid rgba(0,229,255,.4);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:pulse 3s ease infinite}
.nav-links{display:flex;gap:20px;font-size:11px}
.nav-links a{cursor:pointer;transition:all .25s;text-decoration:none;color:var(--muted);letter-spacing:1px;position:relative;padding:4px 0}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transition:transform .3s}
.nav-links a:hover{color:var(--accent)}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-links a.active-page{color:var(--accent)}
.nav-links a.active-page::after{transform:scaleX(1)}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-badge{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);color:var(--accent);font-size:9px;padding:3px 10px;letter-spacing:2px}
.live-pill{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--success);letter-spacing:1px}
.live-dot{width:5px;height:5px;background:var(--success);border-radius:50%;box-shadow:0 0 6px var(--success);animation:pulse 1.5s ease infinite}
/* Hero */
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:60px 20px;overflow:hidden}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 10%,rgba(0,229,255,.055) 0%,transparent 65%),radial-gradient(ellipse 40% 30% at 80% 80%,rgba(124,58,237,.04) 0%,transparent 60%);pointer-events:none}
.hero-scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(0,229,255,.6) 50%,transparent 95%);animation:scanLine 5s linear infinite;pointer-events:none;filter:blur(.5px)}
.hero-tag{
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);
  color:var(--accent);font-size:10px;padding:6px 18px;letter-spacing:3px;
  margin-bottom:32px;display:inline-block;cursor:default;
  transition:all .3s;position:relative;overflow:hidden;
}
.hero-tag::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,229,255,.12),transparent);transform:translateX(-100%);transition:transform .6s}
.hero-tag:hover{background:rgba(0,229,255,.12);box-shadow:0 0 30px rgba(0,229,255,.25),inset 0 0 20px rgba(0,229,255,.06)}
.hero-tag:hover::before{transform:translateX(100%)}
.hero h1{font-family:var(--font-head);font-size:clamp(46px,8vw,94px);font-weight:800;line-height:.95;letter-spacing:-4px;color:#fff;margin-bottom:22px}
.hero h1 .accent-word{color:var(--accent);animation:textGlow 4s ease infinite}
.hero p{font-size:14px;color:var(--muted);max-width:540px;line-height:2;margin-bottom:44px}
.btn-primary{
  background:var(--accent);color:#000;font-family:var(--font-mono);font-size:12px;font-weight:700;
  padding:14px 32px;border:none;cursor:pointer;letter-spacing:1.5px;
  transition:all .25s;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-100%)}
.btn-primary:hover::before{transition:transform .5s;transform:translateX(100%)}
.btn-primary:hover{background:#00f5ff;transform:translateY(-3px);box-shadow:0 0 40px rgba(0,229,255,.5),0 8px 30px rgba(0,0,0,.4)}
.btn-primary:active{transform:translateY(-1px)}
.btn-secondary{
  background:transparent;color:var(--text);font-family:var(--font-mono);font-size:12px;
  padding:14px 32px;border:1px solid rgba(0,229,255,.2);cursor:pointer;letter-spacing:1.5px;
  transition:all .25s;position:relative;overflow:hidden;
}
.btn-secondary:hover{border-color:rgba(0,229,255,.5);color:var(--accent);box-shadow:0 0 30px rgba(0,229,255,.15);transform:translateY(-2px)}
.btn-secondary:active{transform:translateY(0)}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:64px}
.hero-stats{display:flex;gap:0;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.02)}
.stat{text-align:center;padding:24px 40px;cursor:default;transition:all .3s;border-right:1px solid rgba(0,229,255,.08);position:relative;overflow:hidden}
.stat:last-child{border-right:none}
.stat::before{content:'';position:absolute;inset:0;background:rgba(0,229,255,.0);transition:background .3s}
.stat:hover::before{background:rgba(0,229,255,.04)}
.stat:hover{transform:translateY(-2px)}
.stat-num{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--accent);transition:all .3s}
.stat:hover .stat-num{text-shadow:0 0 20px var(--accent);transform:scale(1.05)}
.stat-label{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:4px}
/* Feature cards */
.section{padding:80px 40px;max-width:1200px;margin:0 auto;width:100%}
.section-tag{font-size:9px;letter-spacing:3px;color:var(--accent);margin-bottom:14px}
.section-title{font-family:var(--font-head);font-size:38px;font-weight:800;letter-spacing:-1.5px;color:#fff;margin-bottom:16px}
.section-sub{font-size:13px;color:var(--muted);line-height:1.9;max-width:520px}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;margin-top:48px;border:1px solid rgba(0,229,255,.08)}
.feature-card{
  background:rgba(7,15,29,.9);padding:32px;position:relative;overflow:hidden;
  transition:all .35s;cursor:default;border:none;
}
.feature-card:hover{background:rgba(0,229,255,.04);transform:translateY(-2px)}
.feature-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .3s}
.feature-card:hover::before{opacity:1}
.feature-card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .35s}
.feature-card:hover::after{opacity:.6}
.feature-icon{font-size:28px;margin-bottom:18px;display:block;transition:transform .4s;filter:grayscale(.2)}
.feature-card:hover .feature-icon{transform:scale(1.15) rotate(-5deg);filter:grayscale(0)}
.feature-title{font-family:var(--font-head);font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;transition:color .2s}
.feature-card:hover .feature-title{color:var(--accent)}
.feature-desc{font-size:11px;color:var(--muted);line-height:1.9}
/* Workflow */
.workflow-wrap{display:flex;gap:0;margin-top:48px;position:relative;border:1px solid rgba(0,229,255,.08)}
.workflow-step{flex:1;text-align:center;padding:32px 12px;position:relative;cursor:default;transition:all .3s;overflow:hidden}
.workflow-step::after{content:'';position:absolute;top:0;bottom:0;right:0;width:1px;background:rgba(0,229,255,.08)}
.workflow-step:last-child::after{display:none}
.workflow-step:hover{background:rgba(0,229,255,.04)}
.workflow-step::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .3s}
.workflow-step:hover::before{opacity:1}
.step-num{width:44px;height:44px;border:1px solid rgba(0,229,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-family:var(--font-head);font-weight:800;font-size:16px;color:var(--accent);position:relative;z-index:1;transition:all .3s;background:rgba(0,229,255,.04)}
.workflow-step:hover .step-num{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.5)}
.step-lbl{font-size:10px;color:var(--muted);font-family:var(--font-head);font-weight:600;letter-spacing:.5px;transition:color .2s}
.workflow-step:hover .step-lbl{color:var(--accent)}
/* Dashboard */
.dashboard{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 57px);position:relative}
.sidebar{background:rgba(4,10,20,.95);border-right:1px solid rgba(0,229,255,.06);padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:calc(100vh - 57px);backdrop-filter:blur(20px)}
.main-panel{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 57px);background:rgba(2,8,16,.6)}
/* Cards */
.card{background:rgba(7,15,29,.92);border:1px solid rgba(0,229,255,.07);padding:18px;backdrop-filter:blur(8px);transition:border-color .3s}
.card:hover{border-color:rgba(0,229,255,.14)}
.card-title{font-size:9px;letter-spacing:2.5px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;opacity:.8}
.card-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,229,255,.2),transparent)}
/* Inputs */
.input-group{display:flex;flex-direction:column;gap:5px}
.input-label{font-size:9px;color:var(--muted);letter-spacing:1.5px}
.input-field{background:rgba(2,8,16,.8);border:1px solid rgba(0,229,255,.1);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:9px 12px;width:100%;outline:none;transition:all .25s}
.input-field:hover{border-color:rgba(0,229,255,.2)}
.input-field:focus{border-color:rgba(0,229,255,.5);box-shadow:0 0 0 2px rgba(0,229,255,.06),inset 0 0 8px rgba(0,229,255,.04)}
.input-field::placeholder{color:#0d2840}
select.input-field{cursor:pointer}
/* Address */
.address-wrap{position:relative}
.address-display{font-family:var(--font-mono);font-size:9px;color:var(--accent);word-break:break-all;background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.1);padding:9px;line-height:1.8;cursor:pointer;transition:all .25s;user-select:all}
.address-display:hover{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.3);box-shadow:0 0 20px rgba(0,229,255,.08)}
.copy-hint{font-size:8px;color:var(--muted);margin-top:3px;opacity:0;transition:opacity .2s;letter-spacing:.5px}
.address-wrap:hover .copy-hint{opacity:1}
/* Metrics */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.metric{background:rgba(2,8,16,.7);border:1px solid rgba(0,229,255,.07);padding:11px;transition:all .3s;cursor:default;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;width:0;height:100%;background:linear-gradient(90deg,rgba(0,229,255,.06),transparent);transition:width .4s}
.metric:hover::before{width:100%}
.metric:hover{border-color:rgba(0,229,255,.25);transform:translateX(2px)}
.metric-val{font-family:var(--font-head);font-size:16px;font-weight:700;color:#fff;transition:color .2s}
.metric:hover .metric-val{color:var(--accent)}
.metric-lbl{font-size:8px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
/* Risk bar */
.risk-bar-wrap{background:rgba(2,8,16,.8);border:1px solid rgba(0,229,255,.08);height:6px;margin:8px 0;position:relative;overflow:hidden}
.risk-bar{height:100%;transition:width 1.4s cubic-bezier(.34,1.56,.64,1);position:relative}
.risk-shine{position:absolute;top:0;bottom:0;width:80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:slideShine 2.5s ease infinite}
.risk-low{background:linear-gradient(90deg,#00ff88,#00cc66)}
.risk-med{background:linear-gradient(90deg,#f59e0b,#d97706)}
.risk-high{background:linear-gradient(90deg,#ef4444,#dc2626)}
/* Badges */
.badge{display:inline-block;font-size:9px;padding:2px 9px;letter-spacing:1px;font-weight:700;cursor:default;transition:all .25s}
.badge:hover{transform:scale(1.05);filter:brightness(1.3)}
.badge-low{background:rgba(0,255,136,.1);color:#00ff88;border:1px solid rgba(0,255,136,.25)}
.badge-med{background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.badge-high{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.25)}
.badge-exchange{background:rgba(124,58,237,.1);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.badge-unknown{background:rgba(61,96,128,.1);color:var(--muted);border:1px solid rgba(61,96,128,.2)}
.badge-donation{background:rgba(0,255,136,.08);color:#00ff88;border:1px solid rgba(0,255,136,.2)}
.badge-mixer{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.25)}
.badge-scam{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
/* Flags */
.flag-item{display:flex;gap:10px;padding:10px;background:rgba(2,8,16,.6);border-left:2px solid rgba(245,158,11,.4);margin-bottom:6px;cursor:default;transition:all .3s;position:relative;overflow:hidden}
.flag-item::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(245,158,11,.06),transparent);opacity:0;transition:opacity .3s}
.flag-item:hover::before{opacity:1}
.flag-item:hover{border-left-color:var(--warn);transform:translateX(4px)}
.flag-item:last-child{margin-bottom:0}
.flag-icon{flex-shrink:0;font-size:14px}
.flag-title{font-size:10px;font-weight:700;color:var(--warn);margin-bottom:3px;transition:color .2s}
.flag-item:hover .flag-title{color:#fcd34d}
.flag-desc{color:var(--muted);line-height:1.7;font-size:9px}
/* Graph */
.graph-wrap{background:rgba(2,6,14,.95);border:1px solid rgba(0,229,255,.08);position:relative;overflow:hidden}
#cy{width:100%;height:500px}
.graph-controls{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(0,229,255,.06);align-items:center;flex-wrap:wrap;background:rgba(2,8,16,.8)}
.graph-btn{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.1);color:var(--muted);font-family:var(--font-mono);font-size:9px;padding:5px 11px;cursor:pointer;transition:all .25s;letter-spacing:.5px;white-space:nowrap}
.graph-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.1);box-shadow:0 0 12px rgba(0,229,255,.2)}
.graph-btn:active{transform:scale(.96)}
.graph-legend{display:flex;flex-wrap:wrap;gap:12px;padding:9px 12px;border-top:1px solid rgba(0,229,255,.06);font-size:10px;background:rgba(2,8,16,.6)}
.legend-item{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:default;transition:all .25s;padding:2px 4px}
.legend-item:hover{color:var(--text)}
.legend-dot{width:8px;height:8px;border-radius:1px;transition:all .3s}
.legend-item:hover .legend-dot{transform:scale(1.5);border-radius:50%}
.graph-hint{position:absolute;bottom:50px;right:10px;font-size:8px;color:rgba(61,96,128,.8);background:rgba(2,8,16,.85);border:1px solid rgba(0,229,255,.08);padding:5px 9px;pointer-events:none;letter-spacing:.5px}
/* Graph zoom indicator */
.zoom-indicator{position:absolute;top:10px;right:10px;background:rgba(2,8,16,.85);border:1px solid rgba(0,229,255,.12);padding:5px 10px;font-size:9px;color:var(--accent);letter-spacing:1px;pointer-events:none;transition:opacity .3s}
/* Tooltip */
.tooltip-box{position:fixed;background:rgba(4,12,24,.97);border:1px solid rgba(0,229,255,.3);padding:14px;pointer-events:none;z-index:9999;min-width:220px;max-width:300px;box-shadow:0 0 40px rgba(0,229,255,.15),0 8px 32px rgba(0,0,0,.8);animation:fadeInFast .15s ease}
.tooltip-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.tooltip-addr{color:var(--accent);font-size:9px;word-break:break-all;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(0,229,255,.1)}
.tooltip-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:5px}
.tooltip-key{color:var(--muted);font-size:9px}
.tooltip-val{color:var(--text);font-size:9px;font-weight:700}
/* Timeline bars */
.tl-bar-group{display:flex;align-items:flex-end;gap:2px;height:90px;padding:0 2px}
.tl-bar{flex:1;min-width:5px;position:relative;cursor:pointer;transition:all .25s;border-radius:1px 1px 0 0}
.tl-bar:hover{transform:scaleY(1.05);filter:brightness(2)}
.tl-bar.vol-bar{background:rgba(0,229,255,.18);border-top:2px solid var(--accent)}
.tl-bar.count-bar{background:rgba(124,58,237,.18);border-top:2px solid var(--accent2)}
.tl-bar-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(4,12,24,.97);border:1px solid rgba(0,229,255,.2);padding:7px 11px;font-size:9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;text-align:center}
.tl-bar-tip::before{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:rgba(4,12,24,.97);border-right:1px solid rgba(0,229,255,.2);border-bottom:1px solid rgba(0,229,255,.2);transform:translateX(-50%) rotate(45deg)}
.tl-bar:hover .tl-bar-tip{opacity:1}
.tl-labels{display:flex;gap:2px;padding:0 2px;margin-top:5px}
.tl-label{flex:1;font-size:7px;color:rgba(61,96,128,.7);text-align:center;overflow:hidden}
/* Transactions */
.tx-row{display:grid;grid-template-columns:1fr 80px 66px 84px;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(15,32,53,.8);font-size:10px;align-items:center;cursor:pointer;transition:all .2s;position:relative}
.tx-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(0,229,255,.06),transparent);transition:width .3s}
.tx-row:hover::before{width:100%}

<body>
<canvas id="chain-bg"></canvas>
<div id="root"></div>
<script>
/* ── EPIC CHAIN BACKGROUND ── */
(function(){
  const canvas=document.getElementById('chain-bg');
  const ctx=canvas.getContext('2d');
  let W,H,raf,frame=0,mouse={x:-999,y:-999};

  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

  /* Blockchain nodes */
  const NODES=[];
  const N=22;
  for(let i=0;i<N;i++){
    NODES.push({
      x:Math.random()*1.2*window.innerWidth-.1*window.innerWidth,
      y:Math.random()*1.2*window.innerHeight-.1*window.innerHeight,
      vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
      size:6+Math.random()*10,pulse:Math.random()*Math.PI*2,
      pSpeed:.008+Math.random()*.015,
      type:i<4?'hub':i<10?'block':'leaf',
      hash:'0x'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),
      glowRadius:0,
    });
  }

  /* Data packets */
  const PACKETS=[];
  let lastPkt=0;

  /* Hexagonal tiling background */
  const HEX_SIZE=55,HEX_H=HEX_SIZE*Math.sqrt(3);

  function hexPath(cx,cy,r){
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=Math.PI/3*i-Math.PI/6;
      i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    }
    ctx.closePath();
  }

  function drawHexGrid(){
    const cols=Math.ceil(W/HEX_SIZE/1.5)+2,rows=Math.ceil(H/HEX_H)+2;
    ctx.save();
    for(let row=-1;row<rows;row++){
      for(let col=-1;col<cols;col++){
        const cx=col*HEX_SIZE*1.5;
        const cy=row*HEX_H+(col%2===0?0:HEX_H/2);
        const dx=cx-mouse.x,dy=cy-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
        const proximity=Math.max(0,1-dist/320);
        const baseAlpha=.018+proximity*.06;
        hexPath(cx,cy,HEX_SIZE*.5);
        ctx.strokeStyle=`rgba(0,229,255,${baseAlpha})`;
        ctx.lineWidth=proximity>.1?1:.4;
        ctx.stroke();
        if(proximity>.3){
          ctx.fillStyle=`rgba(0,229,255,${proximity*.025})`;
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawChainLink(x1,y1,x2,y2,alpha,isActive){
    const dx=x2-x1,dy=y2-y1,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<10) return;
    const nx=dx/dist,ny=dy/dist,px=-ny,py=nx;

    ctx.save();
    /* Glow line */
    ctx.globalAlpha=alpha*(isActive?.5:.18);
    const grad=ctx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,'rgba(0,229,255,0)');
    grad.addColorStop(.5,`rgba(0,229,255,${isActive?.6:.3})`);
    grad.addColorStop(1,'rgba(0,229,255,0)');
    ctx.strokeStyle=grad;ctx.lineWidth=isActive?2:1;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();

    /* Chain links */
    const segLen=16,gap=5,linkW=3.5;
    const total=Math.floor(dist/(segLen+gap));
    ctx.globalAlpha=alpha*(isActive?.35:.12);
    ctx.strokeStyle=isActive?'rgba(0,229,255,.9)':'rgba(0,180,220,.6)';
    ctx.lineWidth=.8;
    for(let s=0;s<total;s++){
      const t0=(s*(segLen+gap))/dist,t1=((s*(segLen+gap))+segLen)/dist;
      const cx0=x1+dx*t0,cy0=y1+dy*t0,cx1=x1+dx*t1,cy1=y1+dy*t1;
      const side=(s%2===0?1:-1)*linkW;
      ctx.beginPath();
      ctx.moveTo(cx0+px*side,cy0+py*side);
      ctx.lineTo(cx1+px*side,cy1+py*side);
      /* cross bars */
      ctx.moveTo(cx0+px*linkW,cy0+py*linkW);ctx.lineTo(cx0-px*linkW,cy0-py*linkW);
      ctx.moveTo(cx1+px*linkW,cy1+py*linkW);ctx.lineTo(cx1-px*linkW,cy1-py*linkW);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNode(n,alpha){
    const glow=.5+.5*Math.sin(n.pulse);
    const r=n.size;
    const dx=n.x-mouse.x,dy=n.y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    const proximity=Math.max(0,1-dist/200);
    const finalAlpha=alpha*(0.45+glow*.4+proximity*.5);

    ctx.save();
    /* Outer glow */
    const outerGlow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3.5);
    outerGlow.addColorStop(0,`rgba(0,229,255,${.15*glow+proximity*.25})`);
    outerGlow.addColorStop(1,'rgba(0,229,255,0)');
    ctx.globalAlpha=finalAlpha;
    ctx.fillStyle=outerGlow;
    ctx.beginPath();ctx.arc(n.x,n.y,r*3.5,0,Math.PI*2);ctx.fill();

    /* Block body */
    const s=r*.72;
    ctx.globalAlpha=finalAlpha*.9;
    ctx.fillStyle='rgba(2,8,16,.85)';
    ctx.strokeStyle=n.type==='hub'?`rgba(0,229,255,${.5+glow*.5})`
      :n.type==='block'?`rgba(0,180,200,${.3+glow*.3})`:`rgba(0,100,140,${.2+glow*.2})`;
    ctx.lineWidth=n.type==='hub'?1.5:.8;
    ctx.beginPath();ctx.rect(n.x-s,n.y-s,s*2,s*2);ctx.fill();ctx.stroke();

    /* Inner detail lines */
    ctx.globalAlpha=finalAlpha*.4;
    ctx.strokeStyle='rgba(0,229,255,.6)';ctx.lineWidth=.5;
    ctx.beginPath();
    ctx.moveTo(n.x-s*.5,n.y-s*.2);ctx.lineTo(n.x+s*.5,n.y-s*.2);
    ctx.moveTo(n.x-s*.5,n.y+s*.2);ctx.lineTo(n.x+s*.3,n.y+s*.2);
    ctx.moveTo(n.x-s*.5,n.y);ctx.lineTo(n.x+s*.1,n.y);
    ctx.stroke();

    /* Hash label for hub nodes */
    if(n.type==='hub'){
      ctx.globalAlpha=finalAlpha*.5*(0.3+glow*.5+proximity*.4);
      ctx.fillStyle=`rgba(0,229,255,${.4+proximity*.4})`;
      ctx.font=`${6+proximity*2}px Space Mono,monospace`;
      ctx.textAlign='center';
      ctx.fillText(n.hash,n.x,n.y+r+11);
    }
    ctx.restore();
  }

  function drawPacket(p,alpha){
    const from=NODES[p.from],to=NODES[p.to];
    if(!from||!to) return;
    const x=from.x+(to.x-from.x)*p.t;
    const y=from.y+(to.y-from.y)*p.t;
    const fade=p.t<.15?p.t/.15:p.t>.85?(1-p.t)/.15:1;
    ctx.save();
    ctx.globalAlpha=alpha*fade*.9;
    /* Trail */
    const trailLen=6;
    for(let i=0;i<trailLen;i++){
      const ft=Math.max(0,p.t-i*.012);
      const tx=from.x+(to.x-from.x)*ft,ty=from.y+(to.y-from.y)*ft;
      const tg=ctx.createRadialGradient(tx,ty,0,tx,ty,5-i*.6);
      tg.addColorStop(0,`rgba(0,229,255,${.6-i*.08})`);
      tg.addColorStop(1,'rgba(0,229,255,0)');
      ctx.fillStyle=tg;
      ctx.beginPath();ctx.arc(tx,ty,5-i*.6,0,Math.PI*2);ctx.fill();
    }
    /* Head */
    const hg=ctx.createRadialGradient(x,y,0,x,y,7);
    hg.addColorStop(0,'rgba(255,255,255,.9)');
    hg.addColorStop(.3,'rgba(0,229,255,.8)');
    hg.addColorStop(1,'rgba(0,229,255,0)');
    ctx.fillStyle=hg;
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function getEdges(){
    const edges=[];
    NODES.forEach((a,i)=>{
      const sorted=NODES.map((b,j)=>{
        if(i===j) return{j,d:Infinity};
        const dx=b.x-a.x,dy=b.y-a.y;return{j,d:Math.sqrt(dx*dx+dy*dy)};
      }).sort((a,b)=>a.d-b.d);
      const k=a.type==='hub'?5:a.type==='block'?3:2;
      sorted.slice(1,k+1).forEach(({j,d})=>{
        if(d<Math.min(W,H)*.55&&!edges.find(e=>(e.i===j&&e.j===i))) edges.push({i,j,d});
      });
    });
    return edges;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    /* Dark base */
    ctx.fillStyle='rgba(2,8,16,1)';ctx.fillRect(0,0,W,H);

    /* Deep radial glow */
    const bg=ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,W*.7);
    bg.addColorStop(0,'rgba(0,40,80,.6)');bg.addColorStop(.5,'rgba(0,20,50,.3)');bg.addColorStop(1,'rgba(2,8,16,0)');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    /* Mouse radial glow */
    if(mouse.x>0){
      const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,300);
      mg.addColorStop(0,'rgba(0,229,255,.04)');mg.addColorStop(1,'rgba(0,229,255,0)');
      ctx.fillStyle=mg;ctx.fillRect(0,0,W,H);
    }

    /* Hex grid */
    drawHexGrid();

    /* Move nodes */
    NODES.forEach(n=>{
      n.x+=n.vx;n.y+=n.vy;n.pulse+=n.pSpeed;
      if(n.x<-80)n.x=W+80;if(n.x>W+80)n.x=-80;
      if(n.y<-80)n.y=H+80;if(n.y>H+80)n.y=-80;
    });

    /* Edges */
    const edges=getEdges();
    edges.forEach(({i,j,d})=>{
      const a=Math.max(0,1-d/(Math.min(W,H)*.5));
      const ni=NODES[i],nj=NODES[j];
      const dx1=ni.x-mouse.x,dy1=ni.y-mouse.y;
      const dx2=nj.x-mouse.x,dy2=nj.y-mouse.y;
      const nearMouse=Math.sqrt(dx1*dx1+dy1*dy1)<180||Math.sqrt(dx2*dx2+dy2*dy2)<180;
      drawChainLink(ni.x,ni.y,nj.x,nj.y,a,nearMouse);
    });

    /* Packets */
    frame++;
    if(frame-lastPkt>35&&edges.length){
      const e=edges[Math.floor(Math.random()*edges.length)];
      PACKETS.push({from:e.i,to:e.j,t:0,speed:.004+Math.random()*.007});
      lastPkt=frame;
    }
    for(let pi=PACKETS.length-1;pi>=0;pi--){
      PACKETS[pi].t+=PACKETS[pi].speed;
      if(PACKETS[pi].t>=1){PACKETS.splice(pi,1);continue;}
      drawPacket(PACKETS[pi],.85);
    }

    /* Nodes */
    NODES.forEach(n=>drawNode(n,.75));

    /* Vignette */
    const vg=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,W*.8);
    vg.addColorStop(0,'rgba(2,8,16,0)');vg.addColorStop(1,'rgba(2,8,16,.7)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    raf=requestAnimationFrame(draw);
  }
  draw();
})();
</script>

    const {nodes,edges}=buildElements(1,[]);

    const cy=cytoscape({
      container:el,elements:{nodes,edges},
      style:[
        {selector:'node',style:{'background-color':'data(color)','width':'data(size)','height':'data(size)','label':'data(label)','color':'#b0d4f0','font-size':'9px','font-family':'Space Mono,monospace','text-valign':'bottom','text-margin-y':'8px','text-outline-color':'#020810','text-outline-width':'3px','border-width':'1.5px','border-color':'data(color)','border-opacity':'.3','transition-property':'border-width border-opacity width height','transition-duration':'0.25s'}},

                  <div className="report-title">5. RECOMMENDATION</div>
                  <div style={{padding:'12px',background:'rgba(239,68,68,.04)',border:'1px solid rgba(239,68,68,.15)'}}>
                    <ul style={{paddingLeft:'14px'}}>{['Escalate for senior analyst review immediately','Cross-reference Chainalysis / Elliptic databases','File SAR (Suspicious Activity Report)','Monitor Tornado Cash withdrawal timing windows','Preserve blockchain evidence for legal proceedings'].map(item=><li key={item} style={{fontSize:'11px',color:'var(--muted)',lineHeight:'2.1'}}>{item}</li>)}</ul>
                  </div>
                </div>
                <div style={{display:'flex',gap:'10px',marginTop:'18px'}}>
                  <button className="btn-primary" style={{flex:1,padding:'11px',fontSize:'11px'}} onClick={()=>setToast('PDF export simulated (demo mode)')}>⬇ EXPORT REPORT</button>
                  <button className="btn-secondary" style={{flex:1,padding:'11px',fontSize:'11px'}} onClick={()=>copyText(`ChainTrace Report\nWallet: ${data.rootWallet}\nRisk: 72/100 HIGH\n${new Date().toLocaleString()}`,'Summary copied')}>⎘ COPY SUMMARY</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {tooltip&&<NodeTooltip node={tooltip} pos={tooltipPos}/>}
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}
